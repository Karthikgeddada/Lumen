# Render blueprint — free tier: one web service hosting the API and the background worker together.
# PostgreSQL is external (Neon); set DATABASE_URL + DIRECT_URL as secrets in the dashboard.
# Only the 5 required vars are listed — FRONTEND_URL / ALLOWED_ORIGINS (after the Vercel
# deploy), SMTP_* / MAIL_FROM (email) and STORAGE_* (uploads) are added later in the
# service's Environment tab; the app degrades gracefully without them.
# Docs: https://render.com/docs/blueprint-spec
# Free tier: sleeps after ~15 min idle (cold start ~50s); background jobs pause while asleep.
# The paid two-service blueprint (separate Background Worker) is preserved in git history.

services:
  - type: web
    name: lumen-api
    runtime: node
    rootDir: backend # monorepo — build and start inside backend/ (repo root has no package.json)
    plan: free
    region: singapore # closest free region to India; switch to oregon if unavailable on free
    # Python parsers (backend/python-pipelines/) run IN-PROCESS: the worker
    # spawns parse_once.py per document. The build installs their deps into a
    # venv (pdfplumber / python-docx / openpyxl / pandas) — no second service,
    # no PARSE_SERVICE_URL, no token. If the venv can't be built the deploy
    # fails loudly at build time (never a silent parse downgrade).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && (python3 -m venv /opt/py || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv /opt/py)) && /opt/py/bin/pip install --quiet -r python-pipelines/requirements.txt
    startCommand: npx prisma migrate deploy && node scripts/start-all.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string (host ends in -pooler), e.g. postgresql://...@ep-xxx-pooler.../neondb?sslmode=require
      - key: DIRECT_URL
        sync: false # Neon DIRECT connection string (same host WITHOUT -pooler) — used by prisma migrate deploy
      - key: AUTH_SECRET
        generateValue: true
      # FRONTEND_URL / ALLOWED_ORIGINS: add in the Environment tab after the Vercel deploy (CORS + links)
      # SMTP_* / MAIL_FROM: add when you want real emails — until then, verification codes are logged
      # STORAGE_*: add before real uploads (Cloudflare R2 / S3) — seeded demo data needs none
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_BASE_URL
        value: local # run an open-source embedding model in-process — no API/key needed (OpenRouter has no embeddings endpoint)
      - key: AI_EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2 # open-source, 384-dim, ONNX; downloaded on first use (~25 MB)
      - key: MAX_UPLOAD_MB
        value: "500"
      # Python parsers (backend/python-pipelines/) are enabled by default and
      # run in-process — zero configuration. LUMEN_PYTHON_BIN points at the
      # venv built above; unset, the worker uses plain python3 (local dev).
      # Off switch / escape hatches (dashboard): LUMEN_PYTHON_PARSERS=false
      # (JS parsers only) or PARSE_SERVICE_URL + PIPELINES_TOKEN (remote
      # sidecar, if you ever split the Python workload out again).
      - key: LUMEN_PYTHON_BIN
        value: /opt/py/bin/python
      - key: PARSE_TIMEOUT_MS
        value: "120000"
