# Render blueprint — deploys the Lumen backend (web) + background worker + PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
# After the first deploy, fill in the sync:false secrets in the Render dashboard.

databases:
  - name: lumen-db
    databaseName: lumen
    user: lumen
    plan: basic-256mb

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # set to your Vercel URL, e.g. https://lumen.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated: https://lumen.vercel.app,https://lumen-git-main-xxx.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_DEV_MODE
        value: "false"
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_MODEL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"

  - type: worker
    name: lumen-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false # reuse the same value as lumen-api
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_MODEL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"
