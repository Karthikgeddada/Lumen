# Render blueprint — free tier: one web service hosting the API and the background worker together.
# PostgreSQL is external (Neon); set DATABASE_URL + DIRECT_URL as secrets in the dashboard.
# Docs: https://render.com/docs/blueprint-spec
# Free tier: sleeps after ~15 min idle (cold start ~50s); background jobs pause while asleep.
# The paid two-service blueprint (separate Background Worker) is preserved in git history.

services:
  - type: web
    name: lumen-api
    runtime: node
    plan: free
    region: singapore # closest free region to India; switch to oregon if unavailable on free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node scripts/start-all.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string (host ends in -pooler), e.g. postgresql://...@ep-xxx-pooler.../neondb?sslmode=require
      - key: DIRECT_URL
        sync: false # Neon DIRECT connection string (same host WITHOUT -pooler) — used by prisma migrate deploy
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # set to your Vercel URL, e.g. https://lumen.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # comma-separated: https://lumen.vercel.app,https://lumen-git-main-xxx.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_DEV_MODE
        value: "false"
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_BASE_URL
        value: local # run an open-source embedding model in-process — no API/key needed (OpenRouter has no embeddings endpoint)
      - key: AI_EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2 # open-source, 384-dim, ONNX; downloaded on first use (~25 MB)
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"
